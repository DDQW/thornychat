[package]
name = "client-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
matrix-sdk = { workspace = true }
matrix-sdk-ui = { workspace = true }
matrix-sdk-sqlite = { workspace = true }

tokio = { workspace = true }
tokio-stream = { workspace = true }

keyring = { workspace = true }

directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
zeroize = { workspace = true }
open = { workspace = true }
uuid = { workspace = true }
url = "2"
mime = "0.3"
ts-rs = { version = "12", optional = true, features = ["uuid-impl", "no-serde-warnings"] }

[features]
# Generates the TypeScript bindings the Tauri frontend imports. Off in normal
# builds: `cargo test -p client-core --features ts export_bindings` rewrites
# frontend/src/lib/bindings (see .cargo/config.toml for the output dir).
ts = ["dep:ts-rs"]
