[workspace]
resolver = "2"
members = [
    "crates/client-core",
    "crates/desktop",
    "crates/xtask",
]
# Keep xtask out of bare `cargo build/check/clippy`: the generic release build
# stays identical to a plain `cargo build --release`, and the child cargo that
# `cargo xtask` spawns never tries to relink the xtask exe it's running from.
default-members = [
    "crates/client-core",
    "crates/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Dominik Wölki"]
license = "GPL-3.0-or-later"
repository = "https://github.com/DDQW/thornychat"

[workspace.dependencies]
# Matrix protocol
matrix-sdk = { version = "0.19", default-features = false, features = [
    "sqlite",
    "e2e-encryption",
    "sso-login",
    "markdown",
    "automatic-room-key-forwarding",
] }
matrix-sdk-ui = { version = "0.19", default-features = false }
matrix-sdk-sqlite = { version = "0.19", features = ["state-store", "crypto-store", "event-cache-store", "bundled"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-stream = "0.1"

# Windows platform integration
keyring = { version = "4", features = ["windows-native-keyring-store"] }
# Registry access (autostart, Steam/GOG/Epic detection) and the process
# snapshot the game-activity connectors use. Kept in step with the version
# Tauri's webview stack compiles, so there is one windows-rs in the build.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
] }

# Calls
# Not in the build yet: no crate depends on it, so this pin only fixes the
# starting API surface for `client-core::calls::webrtc_session`. Kept current
# so that work does not begin against a release that is already stale.
webrtc = "0.20"

# Utility
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"
zeroize = { version = "1", features = ["derive", "serde"] }
open = "5"
uuid = { version = "1", features = ["v4", "serde"] }

client-core = { path = "crates/client-core" }

[profile.dev]
# matrix-sdk's crypto deps are slow to build unoptimized; keep dev builds usable
opt-level = 0
# Disk space is tight in this environment; full debug info roughly doubles
# target/ size (large .pdb files) for no benefit since we aren't attaching a
# debugger. Drop it — panics still show file:line via the `RUST_BACKTRACE`
# unwind machinery, just not a full symbol table.
debug = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
